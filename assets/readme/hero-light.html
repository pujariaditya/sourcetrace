<!DOCTYPE html>
<!--
  README hero image.

  Rendered with:
    google-chrome --headless --window-size=4800,1920 --screenshot=hero-light.png \
        --force-device-scale-factor=1 file://$PWD/hero-light.html
  i.e. 8.0 in x 3.2 in at 600 dpi. On GitHub it is displayed at roughly 800 px wide,
  so the type below is sized to stay readable after a 6x downscale: nothing is
  smaller than 8 pt in the 576 x 230.4 pt (= 8.0 x 3.2 in) viewBox.

  This is deliberately NOT the paper's teaser or architecture figure. Those two
  explain a mechanism to a reader who already knows the field. This one answers a
  different question for a stranger who has just landed on the repository: what
  goes in, what comes out, and what the system does when it does not know.

  It therefore uses no field jargon: no "open set", no "FPR95", no "SSL". The one
  numbers shown trace to results/: 99.3% is closed-set attribution accuracy
  (ablation/full.json -> results.mlaad_v5.id_acc, 99.3371...), and 1.14 / 2.70 are
  FPR95 with and without the codec-residual channel (ablation/full.json and
  ablation/no_codec.json -> results.mlaad_v5.fpr95, 1.1428... / 2.6971...).

  The rejection number is the one that earns the panel. Closed-set accuracy is flat
  across every ablation variant (99.25-99.45%), so on its own it tells a visitor what
  is ordinary about this system rather than what is different.

  Static SVG only: no script, no randomness, no external resource.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; width: 100vw; height: 100vh; }
  text { font-family: Georgia, "Times New Roman", serif; fill: #16191d; }
  .brand { font-size: 21px; font-weight: bold; letter-spacing: -0.3px; }
  .tag   { font-size: 10.5px; fill: #45505c; }
  .step  { font-size: 8.2px; fill: #6b7684; letter-spacing: 1.1px; }
  .h     { font-size: 11px; font-weight: bold; }
  .b     { font-size: 8.8px; fill: #39424e; }
  .ans   { font-size: 11px; font-weight: bold; }
  .foot  { font-size: 9.4px; fill: #45505c; }
  .card  { fill: #ffffff; stroke: #c3cbd4; stroke-width: 1.0; }
  .core  { fill: #f4f6f8; stroke: #6b7684; stroke-width: 1.3; }
  .yes   { fill: #ffffff; stroke: #2f6b3f; stroke-width: 1.3; }
  .no    { fill: #ffffff; stroke: #8a5a12; stroke-width: 1.3; }
  .bar   { fill: #8a94a0; }

  /* --- colour layer: last, so it wins the cascade --------------------------
     Same Okabe-Ito hues as the paper figures, so the three read as one system:
     blue is the audio input, warm orange is the codec-residual idea this work
     contributes, green is a confident answer and vermillion an honest refusal.
     Borders and weights are unchanged, so it still reads in greyscale. */
  .bar   { fill: #0072B2; }
  .core  { fill: #F7FAFC; stroke: #0072B2; stroke-width: 1.3; }
  .yes   { fill: #ffffff; stroke: #009E73; stroke-width: 1.5; }
  .no    { fill: #ffffff; stroke: #D55E00; stroke-width: 1.5; }
  .accent{ fill: #D55E00; }
</style>
</head>
<body>
<svg viewBox="0 0 576 230.4" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="h" markerWidth="7" markerHeight="7" refX="5.6" refY="2.6" orient="auto">
      <path d="M0,0 L6,2.6 L0,5.2 Z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- ================================================================ HEADER -->
  <text class="brand" x="20" y="26">sourcetrace</text>
  <text class="tag"   x="20" y="42">Which speech generator made this clip &#8212; and the honesty to say
    <tspan font-style="italic">I don&#8217;t know</tspan>.</text>
  <line x1="20" y1="52" x2="556" y2="52" stroke="#dde2e7" stroke-width="1"/>

  <!-- ============================================================== 1. INPUT -->
  <text class="step" x="20" y="70">YOU GIVE IT</text>
  <rect class="card" x="20" y="78" width="112" height="78" rx="4"/>

  <!-- a waveform, drawn as static bars -->
  <g class="bar">
    <rect x="30"  y="110" width="3" height="10"/>
    <rect x="36"  y="104" width="3" height="22"/>
    <rect x="42"  y="98"  width="3" height="34"/>
    <rect x="48"  y="107" width="3" height="16"/>
    <rect x="54"  y="94"  width="3" height="42"/>
    <rect x="60"  y="102" width="3" height="26"/>
    <rect x="66"  y="90"  width="3" height="50"/>
    <rect x="72"  y="101" width="3" height="28"/>
    <rect x="78"  y="96"  width="3" height="38"/>
    <rect x="84"  y="108" width="3" height="14"/>
    <rect x="90"  y="100" width="3" height="30"/>
    <rect x="96"  y="105" width="3" height="20"/>
    <rect x="102" y="97"  width="3" height="36"/>
    <rect x="108" y="109" width="3" height="12"/>
    <rect x="114" y="103" width="3" height="24"/>
    <rect x="120" y="111" width="3" height="8"/>
  </g>
  <text class="b" x="76" y="150" text-anchor="middle">one 4-second audio clip</text>

  <path d="M138,117 L160,117" stroke="#6b7684" stroke-width="1.4" fill="none"
        marker-end="url(#h)"/>

  <!-- =============================================================== 2. CORE -->
  <text class="step" x="170" y="70">IT WORKS OUT</text>
  <!-- "two views" was wrong: the front end fuses THREE channels (WavLM, the
       phase/modulation signature, the codec residual). The count is load-bearing because
       the answer card refers to "step 2", so the fix is to name the third rather than
       drop the numbering. -->
  <rect class="core" x="170" y="78" width="158" height="90" rx="4"/>
  <text class="h" x="180" y="94">three views of one clip</text>
  <text class="b" x="180" y="110">1. what a speech model hears</text>
  <text class="b" x="180" y="124">2. what a compressor gets <tspan font-style="italic">wrong</tspan></text>
  <text class="b" x="191" y="136">when it re-compresses it</text>
  <text class="b" x="180" y="150">3. phase and rhythm of the clip</text>
  <text class="b" x="180" y="163" font-style="italic">step 2 is what rejection needs</text>

  <path d="M334,117 L356,117" stroke="#6b7684" stroke-width="1.4" fill="none"
        marker-end="url(#h)"/>

  <!-- ============================================================ 3. ANSWERS -->
  <text class="step" x="366" y="70">YOU GET BACK</text>

  <rect class="yes" x="366" y="78" width="190" height="36" rx="4"/>
  <text class="ans" x="376" y="94" fill="#2f6b3f">&#10003;&nbsp; &#8220;MeloTTS made this&#8221;</text>
  <!-- Inline style, not a font-size attribute: the .b class rule would override the
       attribute (CSS beats presentation attributes in SVG). This line is the longest
       in the answer card and touches the box border at 8.8. -->
  <text class="b" style="font-size:8.0px" x="376" y="108">right on 99.3% of MLAAD v5 known-family clips</text>

  <!-- Taller than the accept card on purpose. The two rates are NOT a matched pair:
       99.3% is closed-set attribution accuracy, 1.14% is a rejection error measured at a
       fixed 95%-new-generator-recall operating point. A visitor who reads them as two
       error rates of the same kind has been misled by the layout, so the qualifier sits
       on the card itself rather than only in the footer. -->
  <rect class="no" x="366" y="120" width="190" height="46" rx="4"/>
  <text class="ans" x="376" y="136" fill="#8a5a12">?&nbsp; &#8220;none of them &#8212; this one is new&#8221;</text>
  <text class="b" style="font-size:8.0px" x="376" y="150">wrongly refuses 1.14% of those same clips</text>
  <text class="b" style="font-size:7.0px" x="376" y="161">at the setting that catches 95% of new generators</text>

  <!-- ================================================================ FOOTER -->
  <line x1="20" y1="176" x2="556" y2="176" stroke="#dde2e7" stroke-width="1"/>
  <text class="foot" x="20" y="193">Naming the generator behind a synthetic voice supports takedown and provenance work that a</text>
  <text class="foot" x="20" y="207">plain &#8220;real or fake?&#8221; verdict cannot. New generators appear constantly, so refusing to answer</text>
  <text class="foot" x="20" y="221">is a feature. Both rates: MLAAD v5 &#8212; a public benchmark of 65 generator families.</text>

</svg>
</body>
</html>
